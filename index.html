<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitta Shuddhi — Clear Your Mind</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The serene sunrise gradient underneath */
        .background-reveal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 60%, #ffe6cc 0%, #ffb380 20%, #ff8080 45%, #4a3b5c 70%, #0b0f19 100%);
            z-index: 1;
        }

        /* The interactive canvas where the mist lives */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }

        /* Minimalist UI Layer */
        .ui-container {
            position: absolute;
            z-index: 3;
            text-align: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            transition: opacity 1s ease;
        }

        p {
            font-size: 1rem;
            color: #d1d5db;
            letter-spacing: 0.05em;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Interactive controls that should be clickable */
        .interactive-element {
            pointer-events: auto;
        }

        .btn-return {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 0.75rem 2rem;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0; /* Starts hidden, fades in as they clear */
            transform: translateY(10px);
            pointer-events: none;
        }

        .btn-return.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-return:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 25px rgba(255, 230, 204, 0.2);
        }

        .hint {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="background-reveal"></div>

    <canvas id="mistCanvas"></canvas>

    <div class="ui-container">
        <h1 id="mainHeading">You've wandered off the path.</h1>
        <p id="subHeading">Take a deep breath. Gently wipe away the digital noise to reveal the light.</p>
        <a href="https://vishalmerani.com" class="btn-return interactive-element" id="returnBtn">Return to the Path</a>
        <div class="hint">Click or drag across the screen to clear the mist</div>
    </div>

    <script>
        const canvas = document.getElementById('mistCanvas');
        const ctx = canvas.getContext('2d');
        const returnBtn = document.getElementById('returnBtn');
        const heading = document.getElementById('mainHeading');

        let isDrawing = false;
        let totalPixels = 0;
        let clearedPixels = 0;
        let checkThrottling = false;

        // Setup canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawInitialMist();
        }

        // Fill canvas with a calm, deep meditative mist (overcast dark blue/grey)
        function drawInitialMist() {
            // Base mist layer
            ctx.fillStyle = '#1e2530';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle noise/texture to make it feel organic
            for (let i = 0; i < canvas.width; i += 4) {
                for (let j = 0; j < canvas.height; j += 4) {
                    if (Math.random() > 0.5) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
                        ctx.fillRect(i, j, 4, 4);
                    }
                }
            }
            
            // Re-enable blending mode for erasing
            ctx.globalCompositeOperation = 'destination-out';
        }

        // Smoothly scratch out the mist
        function clearMist(e) {
            if (!isDrawing) return;

            // Handle both touch and mouse positions
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);

            if (x === undefined || y === undefined) return;

            // Feathered soft brush effect using a radial gradient
            const brushRadius = Math.max(window.innerWidth * 0.06, 60); // Dynamic scale
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, brushRadius);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
            gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            
            // Circle path for clean tracking
            ctx.beginPath();
            ctx.arc(x, y, brushRadius, 0, Math.PI * 2);
            ctx.fill();

            // Throttle calculations for buttery smooth frame rates
            if (!checkThrottling) {
                checkThrottling = true;
                setTimeout(evaluateClearness, 300);
            }
        }

        // Check how much of the screen has been cleared to trigger the return button
        function evaluateClearness() {
            // Sample a downscaled grid to protect performance
            const sampleSize = 20; 
            let clearedPoints = 0;
            let totalPoints = 0;

            for (let x = 0; x < canvas.width; x += sampleSize) {
                for (let y = 0; y < canvas.height; y += sampleSize) {
                    totalPoints++;
                    const imgData = ctx.getImageData(x, y, 1, 1).data;
                    // If the alpha channel is near zero, it's cleared
                    if (imgData[3] < 50) {
                        clearedPoints++;
                    }
                }
            }

            const percentageCleared = (clearedPoints / totalPoints) * 100;

            // Reveal exit if they clear more than 15% of the screen
            if (percentageCleared > 15) {
                returnBtn.classList.add('visible');
                heading.style.opacity = '1';
                heading.innerText = "The path is clear.";
            }
            
            checkThrottling = false;
        }

        // Event Listeners
        window.addEventListener('resize', resizeCanvas);

        // Mouse Events
        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', clearMist);

        // Touch Events (Mobile/Tablet friendly)
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; clearMist(e); });
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', clearMist);

        // Initialize on boot
        resizeCanvas();
    </script>
</body>
</html>
